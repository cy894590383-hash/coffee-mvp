    function addressModal(){if(state.modal!=='addresses')return '';return `<div class="sheet-backdrop" onclick="closeModal(event)"><section class="sheet" onclick="event.stopPropagation()"><header class="sheet-header"><h2>选择配送地址</h2><button class="close" aria-label="关闭" onclick="closeAddresses()">${icon('close')}</button></header>${addresses.map(a=>`<div class="address-row ${a.id===state.addressId?'selected':''}"><button class="address-select" onclick="chooseAddress('${a.id}')">${icon('map')}<span><strong>${a.label} · ${a.name}</strong><span>${a.detail}</span></span><em>${a.id===state.addressId?'当前地址':a.eta}</em></button><button class="address-edit" aria-label="编辑${a.label}地址" onclick="openAddressForm('${a.id}')">${icon('chevron')}</button></div>`).join('')}<button class="new-address-row" onclick="openAddressForm()">${icon('plus')}新增收货地址</button></section></div>`}
    function addressFormModal(){if(state.modal!=='address-form')return '';let address=state.editingAddressId?addressFor(state.editingAddressId):{label:'',name:'',phone:'',detail:'',eta:'约 30 分钟'}, title=state.editingAddressId?'编辑地址':'新增地址';return `<div class="sheet-backdrop" onclick="closeModal(event)"><form class="sheet" onclick="event.stopPropagation()" onsubmit="return saveAddress(event)"><header class="sheet-header"><h2>${title}</h2><button class="close" type="button" aria-label="关闭" onclick="closeAddressForm()">${icon('close')}</button></header><label class="form-field"><span>地址标签</span><input name="label" value="${escapeHtml(address.label)}" placeholder="如：公司、家" required /></label><label class="form-field"><span>收货人</span><input name="name" value="${escapeHtml(address.name)}" placeholder="姓名" required /></label><label class="form-field"><span>手机号</span><input name="phone" value="${escapeHtml(address.phone||'')}" placeholder="手机号" inputmode="tel" required /></label><label class="form-field"><span>详细地址</span><input name="detail" value="${escapeHtml(address.detail)}" placeholder="街道、楼层、房间号" required /></label><footer class="form-footer"><button class="primary wide" type="submit">保存地址</button></footer></form></div>`}
    function render(){let pages={home,menu,search,orders,profile,membership,coupons,points,'address-book':addressBook,settings:settingsPage,checkout,success};$('#app').innerHTML=pages[state.view]()+cartBar()+(!['checkout','success','search','membership','coupons','points','address-book','settings'].includes(state.view)?nav():'')+productModal()+cartModal()+storeModal()+addressModal()+addressFormModal();if(window.lucide)lucide.createIcons();if(state.view==='search')requestAnimationFrame(()=>$('#searchInput')?.focus());}
    function go(v,cat){state.view=v;if(cat)state.category=cat;state.modal=null;render()} function setCategory(c){state.category=c;render()} function setHomeCategory(c){state.homeCategory=c;render()} function openSearch(){state.searchQuery='';state.view='search';render()} function closeSearch(){state.searchQuery='';go('home')} function searchProducts(query){state.searchQuery=query;render()} function setSearchTerm(term){state.searchQuery=term;render()} function setFulfillment(mode){state.fulfillment=mode;save();render()} function setOrderTab(t){state.orderTab=t;render()}
    function openProduct(id){state.selectedProduct=products.find(p=>p.id===id);state.selection={size:'中杯',temperature:'冰',sugar:'正常糖',milk:'牛奶',extra:null};state.modal='product';render()} function closeProduct(){state.modal=null;render()} function pick(k,v){state.selection[k]=v;render()} function closeModal(e){if(e.target.classList.contains('sheet-backdrop')){state.modal=null;render()}}
    function addCart(){let p=state.selectedProduct, s={...state.selection}, price=selectedPrice(p,s), same=state.cart.find(i=>i.id===p.id&&JSON.stringify(i.selection)===JSON.stringify(s));if(same)same.qty++;else state.cart.push({...p,selection:s,unitPrice:price,qty:1});save();state.modal=null;render()} function openCart(){if(!state.cart.length){go('menu');return}state.modal='cart';render()} function closeCart(){state.modal=null;render()} function changeQty(i,d){state.cart[i].qty+=d;if(state.cart[i].qty<=0)state.cart.splice(i,1);save();if(!state.cart.length)state.modal=null;render()}
    function openStores(){state.modal='stores';render()} function closeStores(){state.modal=null;render()} function chooseStore(id){state.storeId=id;save();state.modal=null;render()} function openAddresses(){state.editingAddressId=null;state.addressReturnView='addresses';state.modal='addresses';render()} function closeAddresses(){state.modal=null;render()} function chooseAddress(id){state.addressId=id;save();state.modal=null;render()} function chooseAddressFromBook(id){state.addressId=id;save();render()} function openAddressForm(id=null,returnView=state.addressReturnView||state.view){state.editingAddressId=id;state.addressReturnView=returnView;state.modal='address-form';render()} function closeAddressForm(){let returnView=state.addressReturnView;state.editingAddressId=null;if(returnView==='address-book'){state.modal=null;state.view='address-book';render()}else openAddresses()} function saveAddress(event){event.preventDefault();let form=event.currentTarget, values=Object.fromEntries(new FormData(form).entries()), id=state.editingAddressId||`a${Date.now()}`, address={id,label:values.label.trim(),name:values.name.trim(),phone:values.phone.trim(),detail:values.detail.trim(),eta:'约 30 分钟'};if(state.editingAddressId){let index=addresses.findIndex(a=>a.id===id);addresses[index]=address}else addresses.push(address);state.addressId=id;state.editingAddressId=null;save();if(state.addressReturnView==='address-book'){state.modal=null;state.view='address-book';render()}else{state.modal=null;render()}return false} function toggleSetting(key){state.settings[key]=!state.settings[key];save();render()}
    function quickReorder(){let p=products[0],s={size:'大杯',temperature:'冰',sugar:'半糖',milk:'燕麦奶',extra:null};state.cart.push({...p,selection:s,unitPrice:selectedPrice(p,s),qty:1});save();render()} function reorder(id){let o=state.orders.find(x=>x.id===id);o.items.forEach(i=>state.cart.push({...i,selection:{...i.selection},qty:i.qty}));save();go('checkout')} function submitOrder(){let subtotal=cartTotal(),discount=subtotal>=20?3:0, fee=deliveryFee();let id='LY'+Date.now().toString().slice(-8), code='A'+Math.floor(100+Math.random()*900);state.orders.unshift({id,status:'制作中',time:'刚刚',code,fulfillment:state.fulfillment,storeId:state.storeId,addressId:state.addressId,items:state.cart.map(i=>({...i,selection:{...i.selection}})),total:subtotal+fee-discount});state.cart=[];save();state.view='success';render()} function advanceOrder(id){let o=state.orders.find(x=>x.id===id);o.status=o.status==='制作中'?(o.fulfillment==='delivery'?'配送中':'待取餐'):o.status;save();go('success')}
    render();
  </script>
</body>
